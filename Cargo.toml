[package]
name = "jupiter-dex-substreams"
version = "1.0.0"
edition = "2021"
description = "High-performance Substreams for Jupiter DEX with OHLCV candles, SQL sink support (PostgreSQL/ClickHouse), and delta updates"
license = "MIT"
repository = "https://github.com/PaulieB14/Jupiter-Dex-Substreams"
keywords = ["solana", "jupiter", "dex", "substreams", "blockchain"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Substreams core dependencies
substreams = "0.8.0"
substreams-solana = "0.16.0"

# Database sink support
substreams-database-change = "5.0.0"

# Protobuf serialization
buffa = "0.9.2"
buffa-types = "0.9.2"

# Utility dependencies
anyhow = "1.0"
hex = "0.4"
bs58 = "0.5"

# WASM compatibility
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
lto = true
opt-level = 'z'
strip = true